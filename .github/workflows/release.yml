name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发布到 GitHub Releases 需要写权限
permissions:
  contents: write

# 避免同一 ref 的多次运行互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-beta.4
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # macOS：universal 一次构建 + lipo 拆成 arm64 / x86_64 单架构 zip（updater 友好）
  #   updater 只内联解压 .zip/.tar.gz，且 DefaultAssetMatcher 选第一个匹配
  #   platform+arch 的资产；因此必须发“含 .app 的 zip”，绝不能发 .dmg
  #   （dmg 会被原样 rename 成 .app 目录导致安装损坏）。
  # ---------------------------------------------------------------------------
  macos:
    name: Build macOS (arm64, x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Add GOBIN to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Install frontend deps
        run: npm ci --prefix frontend
      # universal 一次构建（arm64+amd64 合并二进制），再 lipo 拆成单架构 .app
      - name: Build universal .app
        run: wails3 task darwin:package:universal
      - name: Split per-arch zips
        shell: bash
        run: |
          set -euo pipefail
          # 产物名由 APP_NAME（gujistudio）决定，且 .app 位置依赖 go-task 工作目录；
          # 用 find 动态定位，避免硬编码路径/大小写出错（曾误写成 build/bin/GujiStudio.app）。
          APP=$(find . -maxdepth 5 -name "gujistudio.app" -not -path "*/node_modules/*" 2>/dev/null | head -n1)
          if [ -z "$APP" ]; then echo "::error::gujistudio.app not found"; exit 1; fi
          BIN="$APP/Contents/MacOS/gujistudio"
          mkdir -p dist-release
          # lipo 的 Intel 切片名为 x86_64；命名 GujiStudio-darwin-x86_64.zip
          # （含 x86_64，updater DefaultAssetMatcher 把它当作 amd64 别名，自动匹配）
          for SLICE in arm64 x86_64; do
            cp -R "$APP" "GujiStudio-${SLICE}.app"
            lipo -extract "$SLICE" "$BIN" \
              -output "GujiStudio-${SLICE}.app/Contents/MacOS/gujistudio"
            strip -x "GujiStudio-${SLICE}.app/Contents/MacOS/gujistudio"
            # 替换二进制后 ad-hoc 签名必须更新，否则用户打开报“已损坏”
            codesign --force --deep --sign - "GujiStudio-${SLICE}.app"
            # 顶层即 GujiStudio.app，updater 解压后 rename 到位
            ditto -c -k --keepParent "GujiStudio-${SLICE}.app" "dist-release/GujiStudio-darwin-${SLICE}.zip"
            rm -rf "GujiStudio-${SLICE}.app"
          done
          ls -la dist-release
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-release/GujiStudio-darwin-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows：amd64 — 发 zip（updater 用）+ NSIS 安装包（保留 -installer 命名，
  #   matcher 跳过含 -installer. 的资产，故自动更新走上面的 zip）。
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Add GOBIN to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          # makensis 不在默认 PATH 上；把 NSIS 安装目录加入 GITHUB_PATH 供后续步骤使用
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Build & package installer
        shell: bash
        run: |
          set -euo pipefail
          wails3 task windows:build ARCH=amd64
          wails3 task windows:package
      - name: Package updater zip + keep installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          # 产物名由 APP_NAME（gujistudio）决定；在 bin/build 下动态定位，
          # 避免硬编码 build/bin/GujiStudio.exe（路径与大小写都不对）。
          $exe = Get-ChildItem -Path "bin","build" -Filter "gujistudio.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "." -Filter "gujistudio.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike "*\node_modules\*" } | Select-Object -First 1
          }
          if (-not $exe) { Write-Error "gujistudio.exe not found"; exit 1 }
          Compress-Archive -Path $exe.FullName -DestinationPath "dist-release/GujiStudio-windows-amd64.zip" -Force
          # NSIS 安装包默认命名含 -installer.；保留该后缀以便 updater 的
          # DefaultAssetMatcher 跳过它、改用上面的 zip 做自动更新。
          $installer = Get-ChildItem -Path "build" -Filter "*installer.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "dist-release/$($installer.Name)"
          } else {
            Write-Warning "NSIS installer not found; only the updater zip will be published."
          }
          ls dist-release
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag 推送运行；汇总两平台 zip + 安装包 + 生成 SHA256SUMS 后建 Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 发版前校验：推送的 tag 必须与 build/config.yml 的 info.version 完全一致。
      # 版本唯一来源就是 build/config.yml：前端 __APP_VERSION__ 与 Go 侧 updater 基线
      # 都在构建期从它读取，因此只需保证「tag == info.version」即可，无需再手动同步别处。
      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME#v}   # 去掉前缀 v：v0.8.7 -> 0.8.7
          # 纯 awk 抽 semver，避免 sed -E 在 Windows runner 上分组+反向引用报错
          CFG=$(awk '/^info:/{f=1} f&&/version:/{if(match($0,/[0-9]+\.[0-9]+\.[0-9]+/)) print substr($0,RSTART,RLENGTH); exit}' build/config.yml)
          echo "tag version      = $TAG"
          echo "config.yml version = $CFG"
          if [ -z "$CFG" ] || [ "$CFG" != "$TAG" ]; then
            echo "::error::版本不一致！请让推送的 tag ($GITHUB_REF_NAME) 与 build/config.yml 的 info.version ($CFG) 相同"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
